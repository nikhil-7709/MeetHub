<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MeetHub | Sign in</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body login-body">
    <main class="shell">
        <section class="brand"><strong>meet<span class="mark">Hub</span></strong>
            <div class="brand-copy">
                <span class="eyebrow">A better way to meet</span>
                <h1>Good meetings<br>start here.</h1>
                <p>A calm place to gather people, ideas, and the next useful decision.</p>
            </div><small>© 2026 MeetHub</small>
            <div class="login-proof"><span class="proof-dot"></span> Your team space is ready</div>
        </section>
        <section class="form-wrap">
            <form class="form" id="loginForm">
                <h2>Welcome back</h2>
                <p class="subtle">Sign in to see your meetings.</p><label for="email">Email</label>
                <input id="email" name="email" type="email" required autocomplete="email"><label for="password">Password</label>
                <input id="password" name="password" type="password" required autocomplete="current-password">
                <div class="error" id="error"></div>
                <button type="submit" class="primary">Sign in</button>
                <p class="subtle">New here? <a href="register.html">Create an account</a></p>
            </form>
        </section>
    </main>
    <script src="login.js"></script>
</body>

</html>
